auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_concurrent_streams: 1000

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Increase query limits to prevent "too many outstanding requests"
query_scheduler:
  max_outstanding_requests_per_tenant: 2048

querier:
  max_concurrent: 20

# Two periods on purpose. Loki picks the period whose `from` covers a chunk's
# timestamp, so everything written before the cutover stays readable through
# boltdb-shipper/v11 while new writes go to TSDB/v13. Schema changes cannot be
# rolled back, and a `from` date is interpreted at 00:00:00 UTC — the date below
# is far enough ahead that UTC midnight had not already passed when it was set.
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
    - from: 2026-08-12
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_tsdb_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Retention and limits
limits_config:
  # Step 2 of the schema migration, completed. The TSDB/v13 period above became
  # active on 2026-08-12, so structured metadata (and native OTLP ingestion) is
  # now supported. Loki validates this against the schema period active at
  # startup, so this must not be set back to true if the v13 period is ever
  # moved into the future again.
  allow_structured_metadata: true
  retention_period: 720h  # 30 days
  max_query_length: 721h
  max_query_parallelism: 32
  max_streams_per_user: 0
  max_global_streams_per_user: 0
  max_entries_limit_per_query: 10000
  max_query_series: 1000
  split_queries_by_interval: 15m
  # Increase ingestion limits
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 10MB

# Compactor for retention enforcement
compactor:
  working_directory: /loki/compactor
  # Loki 3 derives the index store from schema_config.object_store; the old
  # shared_store option was removed. Delete requests still need a store when
  # retention is enabled.
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

analytics:
  reporting_enabled: false
