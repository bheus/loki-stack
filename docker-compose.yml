name: loki-stack

services:
  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - loki

  promtail:
    image: grafana/promtail:3.6.8
    container_name: promtail
    restart: unless-stopped
    # Add systemd-journal group for journal access
    group_add:
      - "999"  # systemd-journal GID
    ports:
      - "1514:1514/tcp"  # Remote syslog over TCP
      - "1514:1514/udp"  # Remote syslog over UDP
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Read positions must outlive the container — see promtail-config.yml.
      - promtail-positions:/positions
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - loki

  grafana:
    image: grafana/grafana:13.1.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_PUBLIC_DASHBOARDS_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - loki

volumes:
  loki-data:
    name: loki-stack_loki-data
  grafana-data:
    name: loki-stack_grafana-data
  promtail-positions:
    name: loki-stack_promtail-positions

networks:
  loki:
    driver: bridge
