name: loki-stack

services:
  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - loki

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    restart: unless-stopped
    # Add systemd-journal group for journal access
    group_add:
      - "999"  # systemd-journal GID
    ports:
      - "1514:1514/tcp"   # Remote syslog over TCP
      - "1514:1514/udp"   # Remote syslog over UDP
      - "12345:12345/tcp" # Alloy UI: live component graph and pipeline debugging
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Alloy reads container logs through the Docker API, so unlike Promtail it
      # does not need /var/lib/docker/containers bind-mounted.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Read positions live under the storage path and must outlive the
      # container. Without them loki.source.docker restarts every container at
      # Since=0 and republishes its whole retained log to Loki.
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - loki

  grafana:
    image: grafana/grafana:13.1.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_PUBLIC_DASHBOARDS_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - loki

volumes:
  loki-data:
    name: loki-stack_loki-data
  grafana-data:
    name: loki-stack_grafana-data
  alloy-data:
    name: loki-stack_alloy-data

networks:
  loki:
    driver: bridge
